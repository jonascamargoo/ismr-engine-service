name: Build Android APK

on:
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    tags:
      - 'v*'                # ao dar push numa tag v* -> builda e cria a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (somente em tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/build/outputs/apk/debug/app-debug.apk
          name: ISMR Android (Kotlin) ${{ github.ref_name }}
          body: |
            APK Android nativo (Kotlin + Jetpack Compose) — Entrega 3.2.

            Login de demonstração: **demo** / **ismr1234**.
            Recurso nativo: vibração + notificação local (tela Home).
            Chamada de API: GET/PUT /preferences autenticados (JWT).
